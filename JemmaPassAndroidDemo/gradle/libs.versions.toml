[versions]
# ──────────────────────────────────────────────────────────────────────────────
# L44.90 — Kotlin 2.3.21 upgrade (Voie B).
#
# Resolves the `kspDebugKotlin` metadata incompatibility caused by
# `litertlm-android:0.11.0` and `fhir-model:1.0.0-beta03` being compiled
# with Kotlin 2.3.0 while the project was on 2.1.0.
#
# Critical-path bumps (Kotlin / KSP / Hilt / Compose / AGP / Gradle):
#   - kotlin            2.1.0   → 2.3.21
#   - ksp               2.1.0-1.0.29 → 2.3.7   (new format: no Kotlin suffix)
#   - hilt              2.57.2  → 2.58         (Kotlin 2.3 metadata fix, stays on AGP 8.x)
#   - agp               8.8.2   → 8.13.2       (R8 8.13.19 supports Kotlin 2.3)
#   - composeBom        2026.02.00 → 2026.04.01 (Compose 1.11 stable)
#   - serializationJson 1.7.3   → 1.9.0        (required for kotlin.time.Instant)
#   - serializationPlugin / kotlinReflect → 2.3.21 (aligned)
# Gradle wrapper bumped 8.10.2 → 8.14 (see gradle-wrapper.properties).
#
# Deliberately UNCHANGED (already K2.3-compatible, no upgrade risk on J-2):
#   coreKtx, lifecycle*, activityCompose, navigation*, workRuntime,
#   securityCrypto, cameraX, gson, exifinterface, splashscreen, material (XML),
#   moshi (1.15.2 compatible with KSP 2.3.7), ossLicenses.
# (Gallery-only deps — Firebase, DataStore/protobuf, AppAuth, richtext, webkit,
#  GenAI prompt, compose navigation — were removed with the Gallery UI.)
# ──────────────────────────────────────────────────────────────────────────────
agp = "8.13.2"
kotlin = "2.3.21"
coreKtx = "1.15.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.10.1"
composeBom = "2026.04.01"
navigation = "2.8.9"
serializationPlugin = "2.3.21"
serializationJson = "1.9.0"
workRuntime = "2.10.0"
gson = "2.12.1"
lifecycleProcess = "2.8.7"
#noinspection GradleDependency
litertlm = "0.11.0"
playServicesTfliteJava = "16.4.0"
playServicesTfliteGpu= "16.4.0"
cameraX = "1.4.2"
splashscreen = "1.2.0-beta01"
hilt = "2.58"
ossLicenses = "0.10.6"
playServicesOssLicenses = "17.1.0"
exifinterface = "1.4.1"
securityCrypto = "1.1.0"
kotlinReflect = "2.3.21"
moshi = "1.15.2"
ksp = "2.3.7"
material = "1.13.0"
navigationFragment = "2.9.8"

[libraries]
