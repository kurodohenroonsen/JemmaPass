<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>IDB Isolation Probe - Dir B</title>
</head>
<body>
  <h1>IDB Isolation Probe - Dir B</h1>
  <pre id="output">Running...</pre>
  <script>
    (async () => {
      const output = document.getElementById('output');
      try {
        const req = indexedDB.open('jemma_isolation_test_db', 1);
        req.onupgradeneeded = (e) => {
          // Si le store n'existe pas, cela peut indiquer une base vierge ou nouvelle
          const db = e.target.result;
          if (!db.objectStoreNames.contains('isolation_store')) {
            db.createObjectStore('isolation_store', { keyPath: 'id' });
          }
        };
        req.onsuccess = (e) => {
          const db = e.target.result;
          try {
            const tx = db.transaction('isolation_store', 'readonly');
            const store = tx.objectStore('isolation_store');
            const getReq = store.get('isolation_key');
            getReq.onsuccess = () => {
              const res = {
                status: 'success',
                read_from: 'dir_b',
                found_data: getReq.result || null,
                is_shared: !!(getReq.result && getReq.result.author === 'dir_a'),
                origin: window.location.origin,
                href: window.location.href
              };
              window.probeResult = res;
              output.textContent = JSON.stringify(res, null, 2);
            };
            getReq.onerror = (err) => {
              const res = { status: 'error_reading', error: String(getReq.error || err) };
              window.probeResult = res;
              output.textContent = JSON.stringify(res, null, 2);
            };
          } catch (txEx) {
            const res = { status: 'error_tx', error: txEx.message, name: txEx.name };
            window.probeResult = res;
            output.textContent = JSON.stringify(res, null, 2);
          }
        };
        req.onerror = (err) => {
          const res = { status: 'error_open', error: String(req.error || err) };
          window.probeResult = res;
          output.textContent = JSON.stringify(res, null, 2);
        };
      } catch (ex) {
        const res = { status: 'exception', error: ex.message, name: ex.name };
        window.probeResult = res;
        output.textContent = JSON.stringify(res, null, 2);
      }
    })();
  </script>
</body>
</html>
